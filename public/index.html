<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/kingsland-logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Kingsland Distributors</title>
    <head>
      <title>
        Kingsland Distributors Ltd | Fine Wines & Spirits in Kampala
      </title>
      <meta
        name="description"
        content="Kingsland Distributors Ltd supplies premium alcoholic and non-alcoholic beverages including fine wines, whiskies, spirits, and soft drinks across Uganda."
      />

      <!-- Open Graph / Facebook / WhatsApp -->
      <meta
        property="og:title"
        content="Kingsland Distributors Ltd | Fine Wines & Spirits in Kampala"
      />
      <meta
        property="og:description"
        content="Discover a premium selection of wines, whiskies, and spirits from trusted global brands. Kingsland Distributors Ltd – redefining beverage excellence in Uganda."
      />
      <meta
        property="og:image"
        content="https://kingslanddistributors.com/preview.jpg"
      />
      <meta property="og:url" content="https://kingslanddistributors.com" />
      <meta property="og:type" content="website" />

      <!-- Twitter (X) Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta
        name="twitter:title"
        content="Kingsland Distributors Ltd | Fine Wines & Spirits in Kampala"
      />
      <meta
        name="twitter:description"
        content="Premium distributor of wines, whiskies, and non-alcoholic beverages in Kampala, Uganda."
      />
      <meta
        name="twitter:image"
        content="https://kingslanddistributors.com/preview.jpg"
      />
    </head>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
